[package]
name = "creator-nightly-reindex"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
openai-api-rs = "6.0.13"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
